name: Update activity graph

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/activity-graph.mjs"
      - ".github/workflows/activity-graph.yml"

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate graph
        run: node .github/scripts/activity-graph.mjs ${{ github.repository_owner }} 31
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph-*.svg
          git diff --cached --quiet || (git commit -m "chore: update activity graph" && git push)
